<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Forest Defense: Geométrico</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .hud { background: #333; width: 800px; padding: 15px; display: flex; justify-content: space-around; align-items: center; border-bottom: 2px solid #555; }
        canvas { background: #2d5a27; border: 5px solid #444; margin-top: 10px; }
        .btn { padding: 8px 15px; cursor: pointer; background: #444; color: white; border: 1px solid #777; }
    </style>
</head>
<body>

    <div class="hud">
        <div id="waveText">Onda: 0</div>
        <div>💰 <span id="money">800</span></div>
        <div>❤️ <span id="lives">15</span></div>
        <button class="btn" onclick="startNextWave()">PRÓXIMA ONDA</button>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let money = 800; let lives = 15; let currentWave = 0;
let enemies = []; let projectiles = []; let barriers = [];
let isNight = false;

const path = [{x: 0, y: 300}, {x: 150, y: 300}, {x: 150, y: 100}, {x: 450, y: 100}, {x: 450, y: 500}, {x: 750, y: 500}];
const spots = [
    {x: 80, y: 230, tower: null, menuOpen: false, selectedType: null},
    {x: 230, y: 160, tower: null, menuOpen: false, selectedType: null},
    {x: 400, y: 180, tower: null, menuOpen: false, selectedType: null},
    {x: 520, y: 420, tower: null, menuOpen: false, selectedType: null}
];

const towerSpecs = {
    azul: { name: 'Yorph', c1: '#3498db', c2: '#2980b9', price: 150, range: 140, rate: 40 },
    vermelha: { name: 'Brutáne', c1: '#e74c3c', c2: '#c0392b', price: 300, range: 220, rate: 100 },
    amarela: { name: 'Molovee', c1: '#f1c40f', c2: '#f39c12', price: 200, range: 130, rate: 50 },
    verde: { name: 'Vaaruni', c1: '#2ecc71', c2: '#27ae60', price: 400, range: 120, rate: 150 },
    laranja: { name: 'Thietu', c1: '#e67e22', c2: '#d35400', price: 350, range: 160, rate: 60 },
    roxa: { name: 'Quetina', c1: '#9b59b6', c2: '#8e44ad', price: 250, range: 150, rate: 120 }
};

class Enemy {
    constructor(type) {
        this.type = type;
        this.x = path[0].x; this.y = path[0].y;
        this.targetIdx = 1;
        this.health = (type === 'corte') ? 1000 : 100;
        this.maxHealth = this.health;
        this.blocked = false;
        this.blessed = false;
        this.timer = 0;
    }
    update() {
        if (this.blocked) return;
        let target = path[this.targetIdx];
        let dx = target.x - this.x; let dy = target.y - this.y;
        let dist = Math.hypot(dx, dy);
        if(dist < 5) {
            this.targetIdx++;
            if(this.targetIdx >= path.length) { lives--; this.health = -1; return; }
        }
        this.x += (dx/dist) * 1.5; this.y += (dy/dist) * 1.5;

        if(this.type === 'clerigo') {
            this.timer++;
            if(this.timer > 180) { this.performAction(); this.timer = 0; }
        }
    }
    performAction() {
        if(Math.random() > 0.5) {
            let tSpot = spots.find(s => s.tower);
            if(tSpot) tSpot.tower.cursed = 120;
        } else {
            enemies.forEach(e => { if(Math.hypot(e.x-this.x, e.y-this.y) < 80) e.blessed = 60; });
        }
    }
}

function drawTriangle(x, y, color) {
    ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(x, y-15); ctx.lineTo(x-12, y+10); ctx.lineTo(x+12, y+10); ctx.closePath(); ctx.fill();
}

function update() {
    ctx.clearRect(0, 0, 800, 600);
    document.getElementById('money').innerText = money;
    document.getElementById('lives').innerText = lives;
    document.getElementById('waveText').innerText = "Onda: " + currentWave + (isNight ? " (Noite)" : " (Dia)");

    // Estrada
    ctx.strokeStyle = "#4d3a2d"; ctx.lineWidth = 40; ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y); path.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();

    // Barreiras Vaaruni
    barriers.forEach((b, i) => {
        ctx.fillStyle = "#d2b48c"; ctx.fillRect(b.x-20, b.y-10, 40, 20);
        let active = false;
        enemies.forEach(en => { if(Math.hypot(en.x - b.x, en.y - b.y) < 25) { en.blocked = true; b.hp -= 1; active = true; } });
        if(b.hp <= 0) { barriers.splice(i, 1); enemies.forEach(e => e.blocked = false); }
    });

    // Torres
    spots.forEach(s => {
        ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(s.x, s.y, 25, 0, Math.PI*2); ctx.fill();
        if(s.tower) {
            let t = s.tower;
            let attacking = t.lastShot > 0; if(attacking) t.lastShot--;
            ctx.fillStyle = attacking ? t.c2 : t.c1;
            
            // Lógica de forma do Thietu
            if(t.name === 'Thietu' && isNight) {
                ctx.fillRect(s.x-12, s.y-12, 24, 24);
            } else {
                ctx.beginPath(); ctx.arc(s.x, s.y, 15, 0, Math.PI*2); ctx.fill();
            }

            // Quetina Ovo/Borboleta
            if(t.name === 'Quetina') {
                let stages = ['#fff', '#000', '#2ecc71', '#ff9ff3'];
                ctx.fillStyle = stages[Math.floor(t.qTimer/150)] || '#ff9ff3';
                ctx.fillRect(s.x+18, s.y-18, 10, 10);
                t.qTimer++;
                if(t.qTimer > 600) { // Explosão
                    enemies.forEach(en => { if(Math.hypot(en.x-s.x, en.y-s.y) < 100) en.health -= 100; });
                    t.qTimer = 0;
                }
            }

            if(t.cursed > 0) { t.cursed--; ctx.strokeStyle = "red"; ctx.lineWidth = 2; ctx.strokeRect(s.x-18, s.y-18, 36, 36); }
            else {
                t.timer++;
                if(t.timer >= t.rate) {
                    let target = enemies.find(en => Math.hypot(en.x - s.x, en.y - s.y) < t.range);
                    if(target) {
                        if(t.name === 'Vaaruni') { if(barriers.length < 2) barriers.push({x: target.x, y: target.y, hp: 300}); }
                        else projectiles.push({x: s.x, y: s.y, target, color: t.c2});
                        t.timer = 0; t.lastShot = 10;
                    }
                }
            }
        }
        if(s.menuOpen) drawMenu(s);
    });

    // Inimigos
    enemies.forEach((e, i) => {
        e.update();
        let color = { camponês: '#8b4513', cavaleiro: '#7f8c8d', nobre: '#9b59b6', clerigo: '#fff', corte: '#f1c40f' }[e.type];
        drawTriangle(e.x, e.y, color);
        if(e.blessed > 0) { e.blessed--; ctx.strokeStyle = "yellow"; ctx.beginPath(); ctx.arc(e.x, e.y, 15, 0, Math.PI*2); ctx.stroke(); }
        if(e.health <= 0) { if(e.health !== -1) money += 25; enemies.splice(i, 1); enemies.forEach(en => en.blocked = false); }
    });

    // Tiros
    projectiles.forEach((p, i) => {
        let dx = p.target.x - p.x; let dy = p.target.y - p.y;
        let dist = Math.hypot(dx, dy);
        p.x += (dx/dist)*15; p.y += (dy/dist)*15;
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
        if(dist < 15) { p.target.health -= 35; projectiles.splice(i, 1); }
    });

    requestAnimationFrame(update);
}

function drawMenu(s) {
    const keys = Object.keys(towerSpecs);
    keys.forEach((k, i) => {
        let x = s.x + (i % 3 - 1) * 55; let y = s.y + (i < 3 ? -60 : 60);
        ctx.fillStyle = towerSpecs[k].c1; ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI*2); ctx.fill();
        if(s.selectedType === k) {
            ctx.fillStyle = "white"; ctx.font = "bold 12px Arial"; ctx.fillText("$"+towerSpecs[k].price, x-15, y-25);
        }
    });
}

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left; const my = e.clientY - rect.top;
    spots.forEach(s => {
        if(Math.hypot(s.x - mx, s.y - my) < 30) {
            if(!s.tower) s.menuOpen = !s.menuOpen; else { money += s.tower.price*0.7; s.tower = null; }
        } else if(s.menuOpen) {
            const keys = Object.keys(towerSpecs);
            keys.forEach((k, i) => {
                let x = s.x + (i % 3 - 1) * 55; let y = s.y + (i < 3 ? -60 : 60);
                if(Math.hypot(x - mx, y - my) < 22) {
                    if(s.selectedType === k) {
                        if(money >= towerSpecs[k].price) {
                            money -= towerSpecs[k].price;
                            s.tower = {...towerSpecs[k], timer: 0, lastShot: 0, cursed: 0, qTimer: 0};
                            s.menuOpen = false;
                        }
                    } else s.selectedType = k;
                }
            });
        }
    });
});

function startNextWave() {
    // --- LÓGICA ATUALIZADA DA QUETINA E CLÉRIGO ---

// No início da função startNextWave:
function startNextWave() {
    if(enemies.length > 0) return;
    currentWave++;
    isNight = currentWave % 2 === 0;

    // Atualiza o ciclo de todas as Quetinas no mapa
    spots.forEach(s => {
        if(s.tower && s.tower.name === 'Quetina') {
            s.tower.qStage++;
            // Se chegou no estágio 4 (Borboleta pronta para explodir)
            if(s.tower.qStage >= 4) {
                triggerButterflyEffect(s.x, s.y);
                s.tower.qStage = 0; // Reseta para Ovo
            }
        }
    });

    let wavePlan = ['camponês', 'camponês', 'cavaleiro', 'clerigo', 'nobre'];
    wavePlan.forEach((t, i) => setTimeout(() => enemies.push(new Enemy(t)), i * 1000));
}

// Nova função para o efeito visual e dano global
function triggerButterflyEffect(startX, startY) {
    // Dano em todos os inimigos
    enemies.forEach(en => {
        en.health -= 150; // Dano alto por ser um ciclo longo
    });

    // Cria a animação da onda rosa
    let radius = 0;
    function animateShockwave() {
        ctx.save();
        ctx.strokeStyle = "rgba(255, 159, 243, 0.5)";
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(startX, startY, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        radius += 20;
        if(radius < 1000) requestAnimationFrame(animateShockwave);
    }
    animateShockwave();
}

// Ajuste na IA do Clérigo (dentro da classe Enemy)
performAction() {
    if(Math.random() > 0.5) {
        let tSpot = spots.find(s => s.tower);
        if(tSpot) tSpot.tower.cursed = 120;
    } else {
        enemies.forEach(e => { 
            // Só abençoa se for outro inimigo e estiver perto
            if(e !== this && Math.hypot(e.x - this.x, e.y - this.y) < 80) {
                e.blessed = 60; 
                e.health = Math.min(e.maxHealth, e.health + 20);
            }
        });
    }
}

// No desenho da Quetina (dentro do update)
if(t.name === 'Quetina') {
    let stages = ['#fff', '#000', '#2ecc71', '#ff9ff3']; // Ovo, Lagarta, Casulo, Borboleta
    ctx.fillStyle = stages[t.qStage];
    ctx.fillRect(s.x + 18, s.y - 18, 12, 12);
    // Texto indicativo do estágio para o jogador não se perder
    ctx.fillStyle = "white";
    ctx.font = "10px Arial";
    let labels = ["Ovo", "Lagarta", "Casulo", "Borboleta"];
    ctx.fillText(labels[t.qStage], s.x + 15, s.y - 25);
}
    if(enemies.length > 0) return;
    currentWave++; isNight = currentWave % 2 === 0;
    let wavePlan = ['camponês', 'camponês', 'cavaleiro', 'clerigo', 'nobre'];
    wavePlan.forEach((t, i) => setTimeout(() => enemies.push(new Enemy(t)), i * 1000));
}

update();
</script>
</body>
</html>
