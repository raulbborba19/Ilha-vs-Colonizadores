<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Forest Defense: O Templo</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .hud { background: #333; padding: 15px; width: 800px; display: flex; justify-content: space-around; border-bottom: 4px solid #555; }
        canvas { background: #27ae60; cursor: pointer; border: 4px solid #34495e; margin-top: 10px; }
        .instrucoes { color: #aaa; font-size: 14px; margin: 5px; }
    </style>
</head>
<body>

    <div class="hud">
        <div>💰 Moedas: <span id="money">600</span></div>
        <div>❤️ Templo: <span id="lives">10</span></div>
        <div>🌊 Onda: <span id="waveText">0</span></div>
        <button onclick="startNextWave()" style="cursor:pointer; background:#e67e22; border:none; color:white; padding:5px 15px; font-weight:bold;">PRÓXIMA ONDA</button>
    </div>
    <div class="instrucoes">Clique no tronco -> Clique na cor -> Veja o preço -> Clique de novo para comprar!</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let money = 600;
let lives = 10;
let currentWave = 0;
let enemies = [];
let projectiles = [];
let waveActive = false;

const path = [{x: -50, y: 300}, {x: 150, y: 300}, {x: 150, y: 100}, {x: 450, y: 100}, {x: 450, y: 500}, {x: 750, y: 500}];

const spots = [
    {x: 100, y: 220, tower: null, menuOpen: false, selectedTowerType: null},
    {x: 220, y: 100, tower: null, menuOpen: false, selectedTowerType: null},
    {x: 380, y: 180, tower: null, menuOpen: false, selectedTowerType: null},
    {x: 520, y: 400, tower: null, menuOpen: false, selectedTowerType: null}
];

const towerSpecs = {
    azul: { name: 'Yorph', color: '#3498db', price: 150, range: 130, damage: 15, fireRate: 40 },
    amarela: { name: 'Molovee', color: '#f1c40f', price: 250, range: 110, damage: 8, fireRate: 50 },
    vermelha: { name: 'Brutáne', color: '#e74c3c', price: 400, range: 220, damage: 50, fireRate: 90 }
};

// --- DESENHO DE HUMANOIDES ---

function drawHumanoid(x, y, color, type, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    
    // Cabeça
    ctx.fillStyle = "#ffdbac"; // Pele
    ctx.beginPath(); ctx.arc(0, -25, 7, 0, Math.PI*2); ctx.fill();
    
    // Corpo/Roupa
    ctx.fillStyle = color;
    if(type === 'Brutáne') { // Lanceiro com flores
        ctx.fillRect(-6, -18, 12, 18);
        ctx.fillStyle = "pink"; ctx.beginPath(); ctx.arc(-5, -15, 3, 0, Math.PI*2); ctx.fill();
    } else {
        ctx.fillRect(-5, -18, 10, 15);
    }
    
    // Pernas e Braços
    ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-5, 5); ctx.moveTo(3, -3); ctx.lineTo(5, 5); ctx.stroke();
    
    ctx.restore();
}

// --- CLASSES ---

class Enemy {
    constructor(type) {
        this.type = type;
        this.x = path[0].x; this.y = path[0].y;
        this.targetIndex = 0;
        this.health = 50; this.maxHealth = 50; this.speed = 1.5;
        this.isMarked = false;

        if(type === 'cavaleiro') { this.health = 150; this.speed = 0.8; this.isMarked = true; }
        if(type === 'nobre') { this.health = 80; this.speed = 1.1; }
    }

    update() {
        let target = path[this.targetIndex];
        let dx = target.x - this.x; let dy = target.y - this.y;
        let dist = Math.hypot(dx, dy);
        if (dist < 5) {
            this.targetIndex++;
            if (this.targetIndex >= path.length) { lives--; this.health = 0; return; }
        }
        this.x += (dx/dist) * this.speed; this.y += (dy/dist) * this.speed;
    }

    draw() {
        let color = this.type === 'cavaleiro' ? '#7f8c8d' : (this.type === 'nobre' ? '#9b59b6' : '#8B4513');
        drawHumanoid(this.x, this.y, color, this.type);
        // Barra de Vida
        ctx.fillStyle = 'red'; ctx.fillRect(this.x-10, this.y-40, 20, 3);
        ctx.fillStyle = 'green'; ctx.fillRect(this.x-10, this.y-40, 20 * (this.health/this.maxHealth), 3);
    }
}

class Projectile {
    constructor(x, y, target, damage, color) {
        this.x = x; this.y = y; this.target = target;
        this.damage = damage; this.color = color;
        this.speed = 7; this.active = true;
    }
    update() {
        let dx = this.target.x - this.x; let dy = this.target.y - this.y;
        let dist = Math.hypot(dx, dy);
        if (dist < 10) { this.target.health -= this.damage; this.active = false; return; }
        this.x += (dx/dist) * this.speed; this.y += (dy/dist) * this.speed;
    }
    draw() {
        ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2); ctx.fill();
    }
}

// --- CONTROLES E CLIQUE ---

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    spots.forEach(s => {
        // 1. Clicar no Tronco para abrir menu
        if (Math.hypot(s.x - mx, s.y - my) < 30 && !s.tower) {
            s.menuOpen = !s.menuOpen;
            s.selectedTowerType = null;
            return;
        }

        // 2. Lógica dentro do Menu
        if (s.menuOpen) {
            const options = [
                {x: s.x - 50, y: s.y - 60, type: 'azul'},
                {x: s.x, y: s.y - 60, type: 'amarela'},
                {x: s.x + 50, y: s.y - 60, type: 'vermelha'}
            ];

            options.forEach(opt => {
                if (Math.hypot(opt.x - mx, opt.y - my) < 20) {
                    // Se clicou na mesma cor de novo: COMPRA
                    if (s.selectedTowerType === opt.type) {
                        const cost = towerSpecs[opt.type].price;
                        if (money >= cost) {
                            money -= cost;
                            s.tower = { ...towerSpecs[opt.type], timer: 0 };
                            s.menuOpen = false;
                            document.getElementById('money').innerText = money;
                        }
                    } else {
                        // Primeiro clique: SELECIONA E MOSTRA PREÇO
                        s.selectedTowerType = opt.type;
                    }
                }
            });
        }
    });
});

function startNextWave() {
    if (enemies.length > 0) return;
    currentWave++;
    document.getElementById('waveText').innerText = currentWave;
    let count = 0;
    let timer = setInterval(() => {
        let type = 'camponês';
        if (count > 2) type = 'cavaleiro';
        if (count > 5) type = 'nobre';
        enemies.push(new Enemy(type));
        count++;
        if (count > 5 + currentWave) clearInterval(timer);
    }, 1200);
}

// --- LOOP DE RENDERIZAÇÃO ---

function loop() {
    ctx.clearRect(0, 0, 800, 600);

    // Estrada
    ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 40; ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y); path.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();

    // Templo
    ctx.fillStyle = '#7f8c8d'; ctx.fillRect(720, 460, 80, 80);

    // Troncos e Torres
    spots.forEach(s => {
        ctx.fillStyle = '#5d4037'; ctx.beginPath(); ctx.arc(s.x, s.y, 25, 0, Math.PI*2); ctx.fill();
        
        if (s.tower) {
            drawHumanoid(s.x, s.y, s.tower.color, s.tower.name, 1.2);
            // Tiro
            s.tower.timer++;
            if(s.tower.timer > s.tower.fireRate) {
                let targets = enemies.filter(en => Math.hypot(en.x - s.x, en.y - s.y) < s.tower.range);
                let prioritized = targets.filter(en => en.isMarked);
                let target = prioritized.length > 0 ? prioritized[0] : targets[0];
                if(target) {
                    projectiles.push(new Projectile(s.x, s.y-25, target, s.tower.damage, s.tower.color));
                    s.tower.timer = 0;
                }
            }
        }

        if (s.menuOpen) {
            const types = ['azul', 'amarela', 'vermelha'];
            types.forEach((type, i) => {
                let ox = s.x + (i-1)*50; let oy = s.y - 60;
                ctx.fillStyle = towerSpecs[type].color;
                ctx.beginPath(); ctx.arc(ox, oy, 18, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = s.selectedTowerType === type ? 'white' : 'black';
                ctx.lineWidth = 3; ctx.stroke();

                if (s.selectedTowerType === type) {
                    ctx.fillStyle = "white"; ctx.font = "bold 14px Arial";
                    ctx.fillText("$" + towerSpecs[type].price, ox - 12, oy - 25);
                }
            });
        }
    });

    enemies.forEach((en, i) => {
        en.update(); en.draw();
        if (en.health <= 0) { enemies.splice(i, 1); money += 25; document.getElementById('money').innerText = money; }
    });

    projectiles.forEach((p, i) => {
        p.update(); p.draw();
        if (!p.active) projectiles.splice(i, 1);
    });

    if(lives <= 0) { alert("Fim de Jogo! O Templo foi dominado."); location.reload(); }
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
