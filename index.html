<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Defense: O Templo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud">
        <div class="stat-box">💰 <span id="money">600</span></div>
        <div class="stat-box">❤️ <span id="lives">10</span></div>
        <div class="stat-box">🌊 Onda: <span id="waveText">0</span></div>
        <button class="btn-wave" onclick="startNextWave()">PRÓXIMA ONDA</button>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <div class="controls-hint">
        Clique no tronco para construir | Clique na torre para vender
    </div>

    <script src="script.js"></script>
</body>
</html>
