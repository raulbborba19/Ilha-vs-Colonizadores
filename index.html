<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Forest Defense: Ciclo das Tribos</title>
    <style>
        body { background: #1a1a1a; color: #f0e6d2; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .hud { background: #3e2723; border-bottom: 5px solid #2b1d19; width: 800px; padding: 15px; display: flex; justify-content: space-around; align-items: center; }
        .time-indicator { font-weight: bold; padding: 5px 15px; border-radius: 20px; text-transform: uppercase; }
        .dia { background: #f1c40f; color: #000; }
        .noite { background: #34495e; color: #fff; box-shadow: 0 0 10px #82ccdd; }
        canvas { border: 8px solid #3e2723; margin-top: 10px; transition: filter 2s; }
        .night-filter { filter: brightness(0.6) saturate(1.2) sepia(0.2) hue-rotate(200deg); }
    </style>
</head>
<body>

    <div class="hud">
        <div id="timeBox" class="time-indicator dia">☀️ DIA</div>
        <div>💰 <span id="money">800</span></div>
        <div>❤️ <span id="lives">15</span></div>
        <button onclick="startNextWave()" style="cursor:pointer; padding:10px; background:#e67e22; border:none; color:white; font-weight:bold;">PRÓXIMA ONDA</button>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let money = 800; let lives = 15; let currentWave = 0;
let enemies = []; let projectiles = []; let barriers = [];
let isNight = false;

const path = [{x: 0, y: 300}, {x: 150, y: 300}, {x: 150, y: 100}, {x: 450, y: 100}, {x: 450, y: 500}, {x: 750, y: 500}];
const spots = [
    {x: 80, y: 230, tower: null, menuOpen: false}, {x: 230, y: 160, tower: null, menuOpen: false},
    {x: 400, y: 180, tower: null, menuOpen: false}, {x: 520, y: 420, tower: null, menuOpen: false}
];

const towerSpecs = {
    // PURAS
    azul: { name: 'Yorph', color: '#3498db', price: 150, range: 140, fireRate: 40, type: 'pure' },
    amarela: { name: 'Molovee', color: '#f1c40f', price: 200, range: 120, fireRate: 50, type: 'pure' },
    vermelha: { name: 'Brutáne', color: '#e74c3c', price: 300, range: 220, fireRate: 100, type: 'pure' },
    // MISTURAS
    laranja: { name: 'Quetina', color: '#e67e22', price: 250, range: 130, fireRate: 60, type: 'mix' },
    verde: { name: 'Thietu', color: '#2ecc71', price: 350, range: 160, fireRate: 70, type: 'mix' },
    roxa: { name: 'Vaaruni', color: '#9b59b6', price: 400, range: 100, fireRate: 120, type: 'mix' }
};

// --- DESENHOS ---

function drawTower(s) {
    ctx.save(); ctx.translate(s.x, s.y);
    const t = s.tower;
    const nightSlow = (t.name !== 'Molovee' && t.name !== 'Thietu' && isNight);
    const nightFast = (isNight && (t.name === 'Molovee' || t.name === 'Thietu'));

    // Visual Base do Personagem
    ctx.fillStyle = t.color;
    if(t.name === 'Quetina') {
        // Asas de Borboleta atrás
        ctx.globalAlpha = 0.5; ctx.fillRect(-15, -35, 30, 15); ctx.globalAlpha = 1;
        ctx.fillStyle = "#ffdbac"; ctx.beginPath(); ctx.arc(0, -25, 7, 0, Math.PI*2); ctx.fill();
        // Ovo/Larva ao lado
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(15, 0, 5, 0, Math.PI*2); ctx.fill();
    } else if(t.name === 'Thietu') {
        ctx.fillStyle = isNight ? "#2c3e50" : "#2ecc71";
        ctx.fillRect(-8, -25, 16, 25);
    } else if(t.name === 'Vaaruni') {
        ctx.fillStyle = "#9b59b6"; ctx.fillRect(-10, -20, 20, 20);
        ctx.fillStyle = "#d2b48c"; ctx.fillRect(-12, -5, 24, 5); // Base de Areia
    } else {
        // Torres antigas (Yorph, Molovee, Brutáne)
        ctx.beginPath(); ctx.arc(0, -20, 10, 0, Math.PI*2); ctx.fill();
    }
    
    // Status do Atirador
    s.timer += (nightFast ? 2 : (nightSlow ? 0.5 : 1));
    if(s.timer >= t.fireRate) {
        let target = enemies.find(e => Math.hypot(e.x - s.x, e.y - s.y) < t.range);
        if(target) {
            if(t.name === 'Vaaruni' && barriers.length < 2) {
                barriers.push({x: target.x, y: target.y, hp: 100});
            } else {
                projectiles.push({x: s.x, y: s.y-20, target, color: t.color});
            }
            s.timer = 0;
        }
    }
    ctx.restore();
}

function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y);
    let speedMult = 1;
    if(isNight) {
        if(e.type === 'camponês') speedMult = 2;
        else speedMult = 0.5;
    }

    // Corpo Humanoide
    ctx.fillStyle = (e.type === 'clerigo') ? "#2ecc71" : (e.type === 'cavaleiro' ? "#7f8c8d" : "#8b4513");
    ctx.fillRect(-5, -20, 10, 20);
    ctx.fillStyle = "#ffdbac"; ctx.beginPath(); ctx.arc(0, -25, 6, 0, Math.PI*2); ctx.fill();

    // Efeitos do Clérigo
    if(e.type === 'clerigo' && e.actionTimer > 100) {
        ctx.strokeStyle = e.actionType === 'benção' ? "#f1c40f" : "#e74c3c";
        ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -20, 25, 0, Math.PI*2); ctx.stroke();
        // Texto do Efeito
        ctx.fillStyle = "white"; ctx.font = "10px Arial"; ctx.fillText(e.actionType, -20, -45);
    }

    e.x += e.vx * speedMult; e.y += e.vy * speedMult;
    ctx.restore();
}

// --- LOGICA DE ONDAS E TEMPO ---

function startNextWave() {
    if(enemies.length > 0) return;
    currentWave++;
    isNight = currentWave % 2 === 0;
    
    const tBox = document.getElementById('timeBox');
    tBox.innerText = isNight ? "🌙 NOITE" : "☀️ DIA";
    tBox.className = "time-indicator " + (isNight ? "noite" : "dia");
    canvas.className = isNight ? "night-filter" : "";

    // Spawn de Inimigos com lógica de Nobre + Escolta
    let wave = ['camponês', 'cavaleiro', 'nobre', 'clerigo'];
    wave.forEach((type, i) => {
        setTimeout(() => {
            enemies.push({
                type, x: path[0].x, y: path[0].y, targetIdx: 1, 
                health: 100, maxHealth: 100, vx: 0, vy: 0,
                actionTimer: 0, actionType: ''
            });
        }, i * 1500);
    });
}

function update() {
    ctx.clearRect(0, 0, 800, 600);
    
    // Estrada
    ctx.strokeStyle = "#5d4037"; ctx.lineWidth = 40; ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y); path.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();

    // Barreiras do Vaaruni (Búfalos de Areia)
    barriers.forEach((b, i) => {
        ctx.fillStyle = "#d2b48c"; ctx.fillRect(b.x-15, b.y-10, 30, 20);
        ctx.fillStyle = "brown"; ctx.fillRect(b.x-15, b.y-15, 30, 4); // Vida da barreira
        // Inimigos colidem com barreira
        enemies.forEach(en => {
            if(Math.hypot(en.x - b.x, en.y - b.y) < 20) {
                en.vx = 0; en.vy = 0; b.hp -= 0.5;
            }
        });
        if(b.hp <= 0) barriers.splice(i, 1);
    });

    // Troncos e Menu
    spots.forEach(s => {
        ctx.fillStyle = "#3e2723"; ctx.beginPath(); ctx.arc(s.x, s.y, 25, 0, Math.PI*2); ctx.fill();
        if(s.tower) drawTower(s);
        if(s.menuOpen) drawMenu(s);
    });

    // Lógica de Movimento Inimigo
    enemies.forEach((e, i) => {
        let target = path[e.targetIdx];
        let dx = target.x - e.x; let dy = target.y - e.y;
        let dist = Math.hypot(dx, dy);
        
        e.vx = (dx/dist) * 1.2; e.vy = (dy/dist) * 1.2;
        
        // IA do Clérigo
        if(e.type === 'clerigo') {
            e.actionTimer++;
            if(e.actionTimer > 150) {
                e.actionType = Math.random() > 0.5 ? 'benção' : 'maldição';
                e.actionTimer = 0;
            }
        }

        drawEnemy(e);
        if(dist < 5) {
            e.targetIdx++;
            if(e.targetIdx >= path.length) { enemies.splice(i, 1); lives--; }
        }
    });

    requestAnimationFrame(update);
}

// Menu de compra expandido
function drawMenu(s) {
    const types = Object.keys(towerSpecs);
    types.forEach((t, i) => {
        let x = s.x + (i < 3 ? (i-1)*50 : (i-4)*50);
        let y = s.y + (i < 3 ? -60 : 60);
        ctx.fillStyle = towerSpecs[t].color;
        ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI*2); ctx.fill();
    });
}

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    spots.forEach(s => {
        if(Math.hypot(s.x - mx, s.y - my) < 30) s.menuOpen = !s.menuOpen;
        else if(s.menuOpen) {
            // Lógica simplificada de clique no menu para teste
            const types = Object.keys(towerSpecs);
            types.forEach((t, i) => {
                let x = s.x + (i < 3 ? (i-1)*50 : (i-4)*50);
                let y = s.y + (i < 3 ? -60 : 60);
                if(Math.hypot(x - mx, y - my) < 20) {
                    s.tower = { ...towerSpecs[t], timer: 0 };
                    s.menuOpen = false;
                }
            });
        }
    });
});

update();
</script>
</body>
</html>
